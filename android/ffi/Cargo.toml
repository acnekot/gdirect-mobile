[package]
name = "gdirect-mobile"
version = "1.1.0"
edition = "2024"
description = "C interface of gdirect's mobile engine"
license = "GPL-2.0-or-later"

[lib]
name = "gdirect_mobile"
crate-type = ["cdylib", "lib"]

[dependencies]
gdirect-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
