name: Android

on:
  push:
    branches: [android-mobile]
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: android

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already carries the Android SDK, so use its sdkmanager
      # directly (android-actions/setup-android fails to find package 'tools').
      - name: Install SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rust tests
        run: cargo test --workspace

      - name: Build the engine
        run: ABIS="arm64-v8a armeabi-v7a x86_64" ./scripts/build-rust-android.sh

      - name: Flutter checks
        working-directory: android/app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # Optional release key: add the secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > app/android/release.jks
            cat > app/android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          else
            echo "No release key configured; the debug key will sign the build."
          fi

      - name: Build APKs
        working-directory: android/app
        run: flutter build apk --release --split-per-abi

      - name: Name the files
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp app/build/app/outputs/flutter-apk/app-$abi-release.apk dist/gdirect-mobile-android-$abi.apk
          done
          cd dist && sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gdirect-android
          path: android/dist/*

      # Releases come from an android-vX.Y.Z tag, or from a push to android-mobile
      # whose commit message contains [release] (the tag is then taken from pubspec.yaml).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v') || contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android/dist
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else
            TAG="android-v$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' ../app/pubspec.yaml)"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
          else
            gh release create "$TAG" * --target "$GITHUB_SHA" --title "gdirect mobile ${TAG#android-v}" --generate-notes
          fi
