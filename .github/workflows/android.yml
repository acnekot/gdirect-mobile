name: Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rust tests
        run: cargo test --workspace

      - name: Build the engine
        run: ABIS="arm64-v8a armeabi-v7a x86_64" ./scripts/build-rust-android.sh

      - name: Flutter checks
        working-directory: android/app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        working-directory: android/app
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: gdirect-android
          path: android/app/build/app/outputs/flutter-apk/*.apk
